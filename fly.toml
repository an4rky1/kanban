app = 'kanban-board'
primary_region = 'ams'

[build]
  [build.args]
    PHP_OPCACHE_ENABLE = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'kanban_data'
  destination = '/var/www/html/storage/app'

[deploy]
  release_command = 'php artisan migrate --force'
